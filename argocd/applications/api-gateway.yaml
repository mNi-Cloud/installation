apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mni-api-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mni
    mni.mnicloud.jp/responsibility: api-gateway
spec:
  project: mni
  source:
    repoURL: https://github.com/mNi-Cloud/installation.git
    targetRevision: v2/main
    path: config/api-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: api-gateway-aggregated-resource-access-role
      jsonPointers:
        - /rules
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
