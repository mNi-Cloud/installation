apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mni-playground
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mni
    mni.mnicloud.jp/responsibility: playground
spec:
  project: mni
  source:
    repoURL: https://github.com/mNi-Cloud/installation.git
    targetRevision: v2/main
    path: config/playground
  destination:
    server: https://kubernetes.default.svc
    namespace: default
