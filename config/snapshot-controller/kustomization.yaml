apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # The cluster-wide snapshot API and controller are CSI-driver independent.
  # Each CSI integration remains responsible for its own snapshotter sidecar
  # and VolumeSnapshotClass resources.
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
  - https://github.com/kubernetes-csi/external-snapshotter//deploy/kubernetes/snapshot-controller?ref=v8.6.0

# The v8.6.0 upstream Deployment manifest still names the v8.5.0 image even
# though the v8.6.0 multi-architecture image is published. Keep code and image
# on the same Kubernetes 1.36 release line.
images:
  - name: registry.k8s.io/sig-storage/snapshot-controller
    newTag: v8.6.0
