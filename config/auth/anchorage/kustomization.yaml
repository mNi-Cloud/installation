apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/mNi-Cloud/anchorage//config/default?ref=v1.0.3
  - signing-key.yaml

images:
  - name: controller
    newName: ghcr.io/mni-cloud/anchorage
    newTag: "1.0.3"

patches:
  - target:
      kind: Secret
      name: anchorage-cookie-keys
      namespace: anchorage-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: anchorage-cookie-keys
        namespace: anchorage-system
