apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: anchorage-selfsigned
  namespace: anchorage-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: anchorage-jwk
  namespace: anchorage-system
spec:
  commonName: anchorage-jwk
  secretName: anchorage-jwk
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  issuerRef:
    name: anchorage-selfsigned
    kind: Issuer
    group: cert-manager.io
  secretTemplate:
    labels:
      anchorage.mnicloud.jp/jwk: "true"
